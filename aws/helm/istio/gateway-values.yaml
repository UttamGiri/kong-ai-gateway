# Istio ingressgateway. Selector in the Kong chart is istio: ingressgateway.
# AWS: Service LoadBalancer + nlb annotation → NLB (not ALB). ~$0.66/day extra.
platform: ""

autoscaling:
  enabled: false
replicaCount: 1

labels:
  istio: ingressgateway

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
