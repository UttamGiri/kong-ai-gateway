image:
  repository: docker.io/REPLACE_ME/kong-ai-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

istio:
  enabled: true
  gateway:
    selector:
      istio: ingressgateway
    hosts:
      - kong-ai-gateway.example.internal
    port: 80
