image:
  repository: docker.io/uttamgiri32/kong-ai-gateway
  tag: "0.1.2"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  adminPort: 8001
  managerPort: 8002

istio:
  enabled: true
  gateway:
    selector:
      istio: ingressgateway
    hosts:
      - "*"
    port: 80
