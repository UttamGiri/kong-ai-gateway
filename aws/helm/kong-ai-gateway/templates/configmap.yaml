{{- $p := .Values.plugin }}
{{- if not (has $p (list "custom-header" "custom-request-id")) }}
{{- fail "plugin must be custom-header or custom-request-id" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kong-ai-gateway.name" . }}-declarative
  labels:
    {{- include "kong-ai-gateway.labels" . | nindent 4 }}
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
      - name: mock
        url: https://httpbin.org
        routes:
          - name: mock-route
            paths:
              - /
    plugins:
{{- if eq $p "custom-header" }}
{{- $c := index .Values.plugins "custom-header" }}
      - name: custom-header
        config:
          header_name: {{ $c.header_name | quote }}
          header_value: {{ $c.header_value | quote }}
{{- else if eq $p "custom-request-id" }}
{{- $c := index .Values.plugins "custom-request-id" }}
      - name: custom-request-id
        config:
          header_name: {{ $c.header_name | quote }}
{{- end }}
