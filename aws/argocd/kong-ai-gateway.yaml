apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-ai-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UttamGiri/kong-ai-gateway.git
    targetRevision: develop
    path: aws/helm/kong-ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kong-ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
