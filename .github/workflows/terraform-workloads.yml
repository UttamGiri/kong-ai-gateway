# CLI-driven HCP Terraform for workloads. No VCS on this workspace.
# Start from Actions → Terraform workloads → Run workflow → choose plan or apply.
name: Terraform workloads

on:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform command
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

env:
  TF_CLOUD_ORGANIZATION: vaflt-org
  TF_WORKSPACE: kong-ai-gateway-aws-workload
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  terraform:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.command == 'apply' && 'workloads' || 'plan' }}
    defaults:
      run:
        working-directory: aws/terraform/workloads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: ${{ inputs.command == 'apply' }}
        run: terraform apply -input=false -auto-approve -no-color
